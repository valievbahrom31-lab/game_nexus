<div id="main_wrapper">
  <div id="button_cont">
    <div id="filter_buttons">
      <button (click)="toggleSortByDamage()" [class.active] = "sortByDamage()">SORT BY DAMAGE</button>
      <button (click)="toggleShowPowerful()" [class.active] = "showPowerful()">SHOW POWERFUL ONLY</button>
      <button (click)="resetFilters()">RESET FILTERS</button>
    </div>  
  <div id="types_buttons">
    <button 
      *ngFor="let type of weaponTypes()" 
      (click) ="toggleType(type)"
      [class.active] = "selectedTypes().includes(type)"
    >
      {{ type?.toUpperCase() + 'S' }}
    </button>
  </div>
    <div id="input_cont">
      <input placeholder="SEARCH WEAPON" (input)="setSearch($any($event.target).value)">
      <div style="display: flex; gap: 5px; font-size: larger; padding-top: 10px;"><p style="color: white; font-size: large; letter-spacing: 1px;">WEAPONS FOUND:</p><p style="color: #FF6B00; font-size: large;">{{ filteredWeapons().length}}</p></div> 
    </div>
  </div>

  <div id="cards_cont">
    <a *ngFor="let weapon of filteredWeapons()" class="weapon_card" [routerLink]="['/weapons', weapon.id]">
            
      <div class="info">
        <div class="weapon_image">
          <img [src]="'/' + weapon.image">
        </div>
      </div>
      
      <div class="name_cont">
        <p class="name"> {{ weapon.name }}</p>
      </div>
      
      <div class="view_bar">
        VIEW
      </div>
    </a>
  </div>
</div>
